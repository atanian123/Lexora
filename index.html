<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lexora - your personal vocabulary learning companion. Build decks, study with spaced repetition, and master new languages." />
    <meta name="theme-color" content="#0f0f1a" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("lexora.theme") === "light" ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#0f0f1a" : "#f7f9fc");
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <title>Lexora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
